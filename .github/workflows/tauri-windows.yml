name: Build Aurora Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        run: npm install --include=optional --force
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version ^2
      - name: Build Windows installer
        shell: bash
        env:
          VITE_WS_URL: wss://aurora.ddtech.cloud/ws
        run: cargo tauri build --manifest-path desktop-tauri/Cargo.toml --bundles nsis
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: aurora-windows-installer
          path: desktop-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
